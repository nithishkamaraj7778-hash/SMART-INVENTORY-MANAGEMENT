<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billing POS - Restock Management</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #111827 100%);
    }

    .billing-shell {
      padding: 24px;
      display: grid;
      gap: 24px;
    }

    .billing-card {
      background: rgba(255,255,255,0.96);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
    }

    .billing-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 24px;
    }

    .invoice-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.5px;
    }

    .field-group input,
    .field-group select {
      padding: 12px 14px;
      border: 1px solid #dbe2ea;
      border-radius: 12px;
      background: #f8fafc;
    }

    .search-box {
      position: relative;
    }

    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      margin-top: 6px;
      box-shadow: 0 16px 30px rgba(15, 23, 42, 0.12);
      z-index: 20;
      display: none;
      max-height: 220px;
      overflow-y: auto;
    }

    .suggestions .suggestion-item {
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid #f1f5f9;
    }

    .suggestions .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestions .suggestion-item:hover {
      background: #f8fafc;
    }

    .summary-box {
      background: linear-gradient(135deg, #eff6ff, #eef2ff);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #334155;
    }

    .grand-total {
      font-size: 28px;
      font-weight: 800;
      color: #111827;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .action-row button {
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .action-row .primary { background: linear-gradient(135deg, #2563eb, #4f46e5); }
    .action-row .success { background: linear-gradient(135deg, #10b981, #059669); }
    .action-row .warning { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .action-row .danger { background: linear-gradient(135deg, #ef4444, #dc2626); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .modal {
      width: min(460px, 90%);
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.22);
    }

    .modal .field-group { margin-bottom: 12px; }

    .printable-invoice {
      display: none;
    }

    @media print {
      body * { visibility: hidden; }
      .printable-invoice, .printable-invoice * { visibility: visible; }
      .printable-invoice { position: absolute; top: 0; left: 0; width: 100%; padding: 20px; background: white; }
    }

    @media (max-width: 960px) { .billing-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="billing-shell">
    <div class="billing-card">
      <div class="page-header-title">
        <h1>POS Billing</h1>
        <p>Fast checkout with automatic inventory updates.</p>
      </div>

      <div class="invoice-meta">
        <div class="field-group">
          <label>Invoice Number</label>
          <input id="invoiceNumber" readonly>
        </div>
        <div class="field-group">
          <label>Date</label>
          <input id="invoiceDate" readonly>
        </div>
        <div class="field-group">
          <label>Time</label>
          <input id="invoiceTime" readonly>
        </div>
        <div class="field-group">
          <label>Cashier Name</label>
          <input id="cashierName" value="Admin">
        </div>
        <div class="field-group">
          <label>Customer Name</label>
          <input id="customerName" placeholder="Optional">
        </div>
        <div class="field-group">
          <label>Customer Phone</label>
          <input id="customerPhone" placeholder="Optional">
        </div>
      </div>
    </div>

    <div class="billing-grid">
      <div class="billing-card">
        <div class="field-group search-box">
          <label>Product Search</label>
          <input id="productSearch" placeholder="Search by product name or barcode">
          <div id="suggestions" class="suggestions"></div>
        </div>

        <div class="invoice-meta">
          <div class="field-group">
            <label>Product Name</label>
            <input id="selectedProductName" readonly>
          </div>
          <div class="field-group">
            <label>Price</label>
            <input id="selectedPrice" readonly>
          </div>
          <div class="field-group">
            <label>Available Quantity</label>
            <input id="selectedQuantity" readonly>
          </div>
          <div class="field-group">
            <label>Quantity</label>
            <input id="selectedQty" type="number" min="1" value="1">
          </div>
          <div class="field-group">
            <label>Discount %</label>
            <input id="selectedDiscount" type="number" min="0" value="0">
          </div>
          <div class="field-group">
            <label>GST %</label>
            <input id="selectedGst" type="number" min="0" value="0">
          </div>
        </div>

        <div class="action-row">
          <button class="primary" id="addProductBtn">Add Product</button>
          <button class="warning" id="clearBillBtn">Clear Bill</button>
        </div>

        <div class="table-responsive" style="margin-top: 16px;">
          <table class="custom-table" id="billTable">
            <thead>
              <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Discount %</th>
                <th>GST %</th>
                <th>Subtotal</th>
                <th>Remove</th>
              </tr>
            </thead>
            <tbody id="billItemsBody">
              <tr><td colspan="7" style="text-align:center;color:#64748b;">No items added yet.</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="billing-card">
        <div class="summary-box">
          <div class="summary-row"><span>Subtotal</span><strong id="subtotalDisplay">0.00</strong></div>
          <div class="summary-row"><span>Discount</span><strong id="discountDisplay">0.00</strong></div>
          <div class="summary-row"><span>GST</span><strong id="gstDisplay">0.00</strong></div>
          <div class="grand-total"><span>Grand Total</span><div id="grandTotalDisplay">0.00</div></div>
        </div>

        <div class="action-row" style="margin-top: 16px;">
          <button class="success" id="completePaymentBtn">Complete Payment</button>
          <button class="warning" id="printInvoiceBtn">Print Invoice</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="paymentModal">
    <div class="modal">
      <h3 style="margin-bottom: 12px;">Payment Details</h3>
      <div class="field-group">
        <label>Payment Method</label>
        <select id="paymentMethod">
          <option value="Cash">Cash</option>
          <option value="UPI">UPI</option>
          <option value="Card">Card</option>
        </select>
      </div>
      <div class="field-group">
        <label>Cash Received</label>
        <input id="cashReceived" type="number" min="0" step="0.01" placeholder="0.00">
      </div>
      <div class="field-group">
        <label>Balance Return</label>
        <input id="balanceReturn" readonly>
      </div>
      <div class="action-row">
        <button class="success" id="confirmPaymentBtn">Confirm Payment</button>
        <button class="danger" id="cancelPaymentBtn">Cancel</button>
      </div>
    </div>
  </div>

  <div class="printable-invoice" id="printInvoiceArea"></div>
  <div class="toast-container" id="toastContainer"></div>
  <div class="loading-overlay" id="loadingOverlay"><div class="loading-spinner"></div></div>

  <script src="js/app.js"></script>
  <script src="js/billing.js"></script>
</body>
</html>
