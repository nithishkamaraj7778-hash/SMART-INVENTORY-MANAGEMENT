<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restock Management - Account Access</title>
  <link rel="stylesheet" href="css/login.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

  <div class="login-box">
    <div class="logo">
      <i class="fa-solid fa-boxes-stacked"></i>
    </div>
    <h1>Restock Management</h1>
    <p>Inventory & Billing Control Center</p>

    <form id="loginForm">
      <div class="input-box">
        <i class="fa-solid fa-user"></i>
        <input type="text" id="username" placeholder="Username" required autocomplete="username">
      </div>
      
      <div class="input-box">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
        <i class="fa-solid fa-eye toggle" id="togglePassword"></i>
      </div>

      <div class="input-box hidden" id="confirmPasswordGroup">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="confirmPassword" placeholder="Confirm Password" autocomplete="new-password">
      </div>

      <button type="submit" id="loginBtn">
        <i class="fa-solid fa-right-to-bracket"></i> Login
      </button>

      <p class="auth-switch">
        <span id="authHint">New here?</span>
        <a href="#" id="toggleAuthMode">Create account</a>
      </p>
      
      <p id="error"></p>
    </form>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
